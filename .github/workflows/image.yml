# Builds the Docker image of track_2a/ for linux/amd64 and publishes it to the GitHub Container Registry,
# where the organisers pull it: ghcr.io/<owner>/<repository>:latest, and one tag per commit.
# After the first run, make the package public (package settings on GitHub), so that it can be pulled.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "track_2a/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: track_2a
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
